<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0908" />
    <title>Кандидаты</title>
    <link rel="icon" type="image/png" href="assets/umc-fav.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0a0908;
        --gold: #cba876;
        --wine: #7c2b3a;
        --paper: #f4efe6;
        --dim: rgba(244, 239, 230, 0.58);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: var(--paper);
        font-family: Manrope, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 24px 40px;
      }
      .logo {
        height: 58px;
        width: auto;
        padding: 5px 7px 6px;
        background: var(--paper);
        border-radius: 10px;
        margin-bottom: 18px;
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: clamp(36px, 6vw, 64px);
        letter-spacing: -0.03em;
        margin: 0 0 8px;
        text-align: center;
      }
      .lead {
        color: var(--dim);
        text-align: center;
        max-width: 520px;
        line-height: 1.55;
        margin: 0 0 28px;
        font-size: 15px;
      }
      .grid {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      a.card {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .frame {
        aspect-ratio: 4 / 5;
        border-radius: 1.7rem;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(244, 239, 230, 0.12);
        background: linear-gradient(160deg, rgba(124, 43, 58, 0.45), #141210 62%);
      }
      .frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 58% 18%;
        display: block;
        transition: transform 0.55s ease;
      }
      a.card:hover .frame img { transform: scale(1.04); }
      .initials {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", serif;
        font-size: 4.6rem;
        color: rgba(244, 239, 230, 0.28);
      }
      .name {
        margin-top: 16px;
        text-align: center;
      }
      .name b {
        display: block;
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 500;
      }
      .name span {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .tg {
        margin-top: 44px;
        color: var(--gold);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 13px;
        text-decoration: none;
      }
      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; max-width: 380px; }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="assets/logo-top2.png" alt="УМЦ — Университет мировых цивилизаций" />
    <h1>Кандидаты</h1>
    <p class="lead">Выберите участника, чтобы открыть страницу. Голос принимается только в Telegram.</p>
    <div class="grid">
      <a class="card" href="1/">
        <div class="frame"><img src="assets/petrov.png" alt="Матвей Петров" /></div>
        <div class="name"><b>Матвей Петров</b><span>Кандидат</span></div>
      </a>
      <a class="card" href="2/">
        <div class="frame"><div class="initials">ВП</div></div>
        <div class="name"><b>Валентин Пупликов</b><span>Кандидат</span></div>
      </a>
      <a class="card" href="3/">
        <div class="frame"><div class="initials">ДМ</div></div>
        <div class="name"><b>Дарина Мамедова</b><span>Кандидат</span></div>
      </a>
    </div>
    <a class="tg" href="https://t.me/smarty_gector_ai_bot?start=vote" target="_blank" rel="noreferrer">Голосовать в Telegram</a>
  </body>
</html>
