ех на своём официальном сайте!`,paragraphs:[`Меня зовут Дарина Мамедова. Всю жизнь я совмещаю актёрскую профессию с карьерой тележурналиста.`,`Я прошла путь на ТВ от корреспондента до телеведущей и продюсера. Мне повезло — я работала во всех телевизионных жанрах: новости, интервью, музыкальные и развлекательные программы, прямые эфиры «Доброго утра» и даже телемагазин. Кстати, я родоначальник этого жанра в России — первую программу «Магазин на диване» я делала как режиссёр и ведущая.`,`Когда я поняла, что хочу делиться своим опытом и навыками с молодыми — так появилась моя Школа.`,`Сегодня я продолжаю реализовываться во всех своих профессиях.`],born:`Родилась 8 апреля в Москве`},Tx=[`ГИТИС им. А.В. Луначарского — актёрский факультет (мастерская О.П. Табакова)`,`МГУ имени М.В. Ломоносова — факультет журналистики (теле- и радиожурналистика)`,`ИПК — режиссёр художественных программ`,`Институт позитивных технологий и консалтинга — психологические приёмы в консультативной работе`],Ex=[`Художественный руководитель Медиа Школы Ольги Спиркиной ostankino.tv`,`Академик Международной Академии Телевидения`,`Член Союза кинематографистов Российской Федерации`,`Член Союза журналистов`,`Член Гильдии актёров кино России`,`Член Союза деятелей музыки, кино и телевидения`,`Преподаватель Московского государственного лингвистического университета`,`Актриса театра «ANTE»`,`Член экспертного совета Комитета Государственной Думы по труду, социальной политике и делам ветеранов`],Dx=[{channel:`ЛДПР ТВ`,role:`Ведущая и автор программы «Обратная сторона медали»`},{channel:`НТВ`,role:`Ведущая утренних выпусков программы «Сегоднячко», шеф-редактор «Сегоднячко. Красная стрела» (телемост Москва — Санкт-Петербург)`},{channel:`РТР (Россия-1)`,role:`Руководитель и ведущая программ «Наш стиль», «Домашний очаг», «Деловой автограф», ведущая программы «Шаг за шагом»`},{channel:`ТВЦ`,role:`Ведущая и автор программы «Живой звук», ведущая-комментатор программы «Навигатор», ведущая программы «Городское собрани
